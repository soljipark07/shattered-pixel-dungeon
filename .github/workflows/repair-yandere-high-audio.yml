name: Repair Yandere High Audio

on:
  push:
    branches:
      - spdlab-4.0-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair MP3 structure without changing pitch or speed
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y mp3val ffmpeg
          src=core/src/main/assets/sounds/yandere_laugh_high.mp3
          cp "$src" yandere_laugh_high_fixed.mp3
          mp3val -f -nb yandere_laugh_high_fixed.mp3 || true
          echo "ORIGINAL:"
          ffprobe -v error -show_entries format=duration,size,bit_rate -of default=nw=1 "$src" || true
          echo "FIXED:"
          ffprobe -v error -show_entries format=duration,size,bit_rate -of default=nw=1 yandere_laugh_high_fixed.mp3
          ffmpeg -v error -i yandere_laugh_high_fixed.mp3 -f null -

      - name: Upload repaired audio
        uses: actions/upload-artifact@v4
        with:
          name: yandere-high-audio-fixed
          path: yandere_laugh_high_fixed.mp3
          if-no-files-found: error
