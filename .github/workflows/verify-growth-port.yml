name: Verify Growth Port

on:
  push:
    branches:
      - spdlab-4.0-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-growth-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify growth profile and exact multi-equip behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          growth = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java")
          assert growth.exists(), "GrowthYandereAlly.java is missing"

          ribbon = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/RedRibbon.java").read_text()
          assert "PROFILE_GROWTH" in ribbon, "RedRibbon growth profile is missing"
          assert "MAX_GROWTH_HEARTS = 48" in ribbon, "48-heart growth progression is missing"

          misc = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/KindofMisc.java").read_text()
          required = [
              "identify();",
              "Talent.onItemEquipped(hero, this);",
              "cursedKnown = true;",
              "if (cursed) equipCursed(hero);",
              "hero.spendAndNext(timeToEquip(hero));",
              "hero.spend(timeToEquip(hero));",
          ]
          for token in required:
              assert token in misc, f"multi-equip behavior missing: {token}"
          PY

      - name: Verify requested yandere fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          growth = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java").read_text()
          blood = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/YandereBloodbath.java").read_text()
          hero = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java").read_text()
          jealousy = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/YandereJealousy.java").read_text()
          ribbon = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/RedRibbon.java").read_text()
          assets = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Assets.java").read_text()

          assert "PITY_TURNS = 1000" in blood, "1000-turn bloodbath pity is missing"
          assert "BASE_CHANCE = 0.0005f" in blood, "bloodbath base chance should start at 0.05%"
          assert "BossHealthBar.isAssigned()" in blood, "boss battle pause guard is missing"
          assert "eligibleTurns" in blood, "bloodbath eligible-turn counter is missing"
          assert "YandereBloodbath.onHeroTimeSpent" in hero, "bloodbath must count all hero time, not movement only"

          assert 'count == 1 ? "왜 쟤랑 얘기해? 나 여기 있는데."' in jealousy, "first NPC jealousy line still says 'again'"
          assert "HEART_ROSE_BUMP = 1" in jealousy, "one misplaced heart should not instantly kill Rose ghost"
          assert "playJealousAttack" in jealousy, "jealous execution should show an attack animation"
          assert "sprite.attack(target.pos, new Callback()" in jealousy, "jealous kill must wait for the attack animation callback"
          assert "finishJealousKill" in jealousy, "jealous kill completion helper is missing"

          assert '"성장 트리"' in ribbon, "growth tree menu entry is missing"
          assert "WndGrowthTree" in ribbon, "growth tree window is not wired into RedRibbon"

          assert "YANDERE_LAUGH_HIGH = YANDERE_LAUGH_MILD" in assets, "broken high MP3 should not be loaded"
          assert "HIGH_LAUGH_PITCH" in growth, "high laugh needs a distinct pitch"
          assert "playHighLaugh()" in growth, "high laugh helper is missing"
          PY
