name: Build Standalone Trinket Checker APK
on:
  push:
    branches:
      - feat/spd-trinket-checker-402
    paths:
      - 'trinket-checker/**'
      - '.github/workflows/build-trinket-checker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Bundle original v4.0.2 game icons
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/00-Evan/shattered-pixel-dungeon/v4.0.2/core/src/main/assets/sprites/items.png \
            -o trinket-checker/app/src/main/assets/items.png
          test -s trinket-checker/app/src/main/assets/items.png
      - name: Build standalone debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -p trinket-checker :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: spd-trinket-seed-checker-v402
          path: trinket-checker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
