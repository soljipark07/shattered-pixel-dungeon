name: Build Lab APK

on:
  push:
    branches:
      - master
      - feature/yandere-lab-v04
      - lab3-growth-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-time help dialogue fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java')
          text = path.read_text(encoding='utf-8')
          old_field = '    private int lastHeroPosForTrapScan = -1;\n'
          new_field = old_field + '    private boolean suppressGuardModeDialogue = false;\n'
          if 'private boolean suppressGuardModeDialogue = false;' not in text:
              if old_field not in text:
                  raise SystemExit('field anchor not found')
              text = text.replace(old_field, new_field, 1)
          old_help = base64.b64decode('').decode('utf-8')
          new_help = base64.b64decode('').decode('utf-8')
          if old_help in text:
              text = text.replace(old_help, new_help, 1)
          elif new_help not in text:
              raise SystemExit('requestHelp anchor not found')
          old_yell = base64.b64decode('ICAgIEBPdmVycmlkZQogICAgcHVibGljIHZvaWQgeWVsbChTdHJpbmcgdGV4dCkgewogICAgICAgIGludCBraW5kID0gZGlhbG9ndWVLaW5kKHRleHQpOwo=').decode('utf-8')
          new_yell = base64.b64decode('').decode('utf-8')
          if old_yell in text:
              text = text.replace(old_yell, new_yell, 1)
          elif new_yell not in text:
              raise SystemExit('yell anchor not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPD-Lab-v03-yandere024
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error

      - name: Commit dialogue source
        run: |
          if git diff --quiet -- core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java; then
            echo "Dialogue fix already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java
          git commit -m "fix: use help request dialogue from peace mode"
          git push origin HEAD:lab3-growth-dev
