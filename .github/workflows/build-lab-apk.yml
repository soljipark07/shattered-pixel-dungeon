name: Build Lab APK

on:
  push:
    branches:
      - master
      - feature/yandere-lab-v04
      - lab3-growth-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply Stage 8 two-tier laugh patch
        if: github.ref == 'refs/heads/lab3-growth-dev'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          growth = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java')
          text = growth.read_text()
          new_method = '''    private void maybePlayLaugh(int kind, int tier, int band) {
              float now = globalGrowthClock();
              if (now - lastHighLaughClock < HIGH_LAUGH_COOLDOWN) return;

              final boolean severeObsession = tier >= 3;
              final String laughSound = severeObsession
                      ? Assets.Sounds.YANDERE_LAUGH_HIGH
                      : Assets.Sounds.YANDERE_LAUGH_MILD;

              float chance;
              if (severeObsession) {
                  if (kind == DIALOGUE_HOSTILE) chance = 0.65f;
                  else if (kind == DIALOGUE_WARNING && band >= 3) chance = 0.50f;
                  else if (tier >= 4) chance = 0.20f;
                  else if (band >= 3) chance = 0.30f;
                  else chance = 0.10f;
              } else {
                  if (kind == DIALOGUE_HOSTILE) chance = 0.45f;
                  else if (kind == DIALOGUE_WARNING && band >= 3) chance = 0.35f;
                  else if (band >= 3) chance = 0.20f;
                  else chance = 0.08f;
              }

              if (Random.Float() < chance) {
                  Sample.INSTANCE.play(laughSound);
                  lastHighLaughClock = now;
              }
          }'''
          pattern = r'    private void maybePlayHighLaugh\(int kind, int tier, int band\) \{.*?\n    \}\n\n    @Override\n    public void yell'
          text, count = re.subn(pattern, new_method + '\n\n    @Override\n    public void yell', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'laugh method replacements: {count}')
          old_call = '        maybePlayHighLaugh(kind, tier, band);'
          if old_call not in text:
              raise SystemExit('old laugh call not found')
          text = text.replace(old_call, '        maybePlayLaugh(kind, tier, band);', 1)
          growth.write_text(text)

          assets = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Assets.java')
          a = assets.read_text()
          bad = 'public static final String CITY_BOSS            = "music/city_boss.mp3";'
          good = 'public static final String CITY_BOSS            = "music/city_boss.ogg";'
          if bad in a:
              a = a.replace(bad, good, 1)
              assets.write_text(a)
          PY

          rm -f core/src/main/assets/sounds/yandere_laugh_mild_exact.mp3.b64

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java \
                  core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Assets.java \
                  core/src/main/assets/sounds/yandere_laugh_mild.mp3 \
                  core/src/main/assets/sounds/yandere_laugh_mild_exact.mp3.b64
          git commit -m "fix: split yandere laughs by obsession stage"
          git push

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPD-Lab-v03-yandere024
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
