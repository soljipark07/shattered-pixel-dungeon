name: Build Lab APK

on:
  push:
    branches:
      - spdlab-4.0-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply Task 6 Yandere hooks once
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f"{label}: expected exactly one anchor, found {count}"
              return text.replace(old, new, 1)

          p = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java')
          text = p.read_text()
          if 'import com.shatteredpixel.shatteredpixeldungeon.actors.mobs.npcs.YandereAlly;' not in text:
              text = replace_once(text,
                  'import com.shatteredpixel.shatteredpixeldungeon.actors.mobs.Mob;\nimport com.shatteredpixel.shatteredpixeldungeon.actors.mobs.Monk;\n',
                  'import com.shatteredpixel.shatteredpixeldungeon.actors.mobs.Mob;\nimport com.shatteredpixel.shatteredpixeldungeon.actors.mobs.npcs.YandereAlly;\nimport com.shatteredpixel.shatteredpixeldungeon.actors.mobs.Monk;\n',
                  'Hero YandereAlly import')
          if 'import com.shatteredpixel.shatteredpixeldungeon.items.RedRibbon;' not in text:
              text = replace_once(text,
                  'import com.shatteredpixel.shatteredpixeldungeon.items.Item;\nimport com.shatteredpixel.shatteredpixeldungeon.items.KindOfWeapon;\n',
                  'import com.shatteredpixel.shatteredpixeldungeon.items.Item;\nimport com.shatteredpixel.shatteredpixeldungeon.items.RedRibbon;\nimport com.shatteredpixel.shatteredpixeldungeon.items.KindOfWeapon;\n',
                  'Hero RedRibbon import')
          if 'RedRibbon.ensureYanderePresent();' not in text:
              text = replace_once(text,
                  '\t\t//calls to dungeon.observe will also update hero\'s local FOV.\n\t\tfieldOfView = Dungeon.level.heroFOV;\n\n',
                  '\t\t//calls to dungeon.observe will also update hero\'s local FOV.\n\t\tfieldOfView = Dungeon.level.heroFOV;\n\t\tRedRibbon.ensureYanderePresent();\n\n',
                  'Hero ensure Yandere')
          if 'YandereAlly.onHeroDamaged(effectiveDamage, preHP, postHP, src);' not in text:
              text = replace_once(text,
                  '\t\tif (effectiveDamage <= 0) return;\n\n\t\tif (buff(Challenge.DuelParticipant.class) != null){\n',
                  '\t\tif (effectiveDamage <= 0) return;\n\t\tYandereAlly.onHeroDamaged(effectiveDamage, preHP, postHP, src);\n\n\t\tif (buff(Challenge.DuelParticipant.class) != null){\n',
                  'Hero Yandere damage hook')
          p.write_text(text)

          p = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/HeroClass.java')
          text = p.read_text()
          if 'import com.shatteredpixel.shatteredpixeldungeon.items.RedRibbon;' not in text:
              text = replace_once(text,
                  'import com.shatteredpixel.shatteredpixeldungeon.items.DeveloperTool;\nimport com.shatteredpixel.shatteredpixeldungeon.items.Item;\nimport com.shatteredpixel.shatteredpixeldungeon.items.Waterskin;\n',
                  'import com.shatteredpixel.shatteredpixeldungeon.items.DeveloperTool;\nimport com.shatteredpixel.shatteredpixeldungeon.items.Item;\nimport com.shatteredpixel.shatteredpixeldungeon.items.RedRibbon;\nimport com.shatteredpixel.shatteredpixeldungeon.items.Waterskin;\n',
                  'HeroClass RedRibbon import')
          if 'new RedRibbon().identify().collect();' not in text:
              text = replace_once(text,
                  '\t\tWaterskin waterskin = new Waterskin();\n\t\twaterskin.collect();\n\n\t\tnew DeveloperTool().collect();\n',
                  '\t\tWaterskin waterskin = new Waterskin();\n\t\twaterskin.collect();\n\n\t\tnew RedRibbon().identify().collect();\n\t\tnew DeveloperTool().collect();\n',
                  'HeroClass RedRibbon collect')
          p.write_text(text)
          PY

          if ! git diff --quiet -- \
            core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java \
            core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/HeroClass.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java \
              core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/HeroClass.java
            git commit -m "[skip ci] feat: adapt yandere companion hooks to v4.0"
            git push origin HEAD:spdlab-4.0-port
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPD-Lab-4.0-port1
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
