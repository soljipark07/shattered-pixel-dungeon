name: Build Lab APK

on:
  push:
    branches:
      - spdlab-4.0-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Port Lab asset registrations once
        run: |
          git fetch origin master:refs/remotes/origin/master
          python -m pip install --quiet pillow
          git show origin/master:core/src/main/assets/sprites/items.png > /tmp/lab-items.png
          cp core/src/main/assets/sprites/items.png /tmp/v4-items-before.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Assets.java')
          text = assets.read_text()
          if 'YANDERE  = "sprites/yandere.png"' not in text:
              anchor = '\t\tpublic static final String VAULT_BOSS_ELEMENTAL= "sprites/vault_boss_elemental.png";\n'
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + '\t\tpublic static final String YANDERE  = "sprites/yandere.png";\n\t\tpublic static final String YANDERE_AURA = "sprites/yandere_aura.png";\n')
              assets.write_text(text)

          sheet = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/sprites/ItemSpriteSheet.java')
          text = sheet.read_text()
          if 'RED_RIBBON' not in text:
              id_anchor = '\tpublic static final int GEO_BOULDER     = UNCOLLECTIBLE+10;\n'
              rect_anchor = '\t\tassignItemRect(GEO_BOULDER,     16, 15);\n'
              assert text.count(id_anchor) == 1 and text.count(rect_anchor) == 1
              text = text.replace(id_anchor, id_anchor + '\tpublic static final int RED_RIBBON      = UNCOLLECTIBLE+11;\n\tpublic static final int YANDERE_HEART   = UNCOLLECTIBLE+12;\n')
              text = text.replace(rect_anchor, rect_anchor + '\t\tassignItemRect(RED_RIBBON,      16, 16);\n\t\tassignItemRect(YANDERE_HEART,   16, 16);\n')
              sheet.write_text(text)

          dst_path = 'core/src/main/assets/sprites/items.png'
          before = Image.open('/tmp/v4-items-before.png').convert('RGBA')
          old_lab = Image.open('/tmp/lab-items.png').convert('RGBA')
          dst = Image.open(dst_path).convert('RGBA')
          assert dst.size == before.size == old_lab.size == (256, 512), (dst.size, before.size, old_lab.size)
          boxes = [(208, 16, 224, 32), (224, 16, 240, 32)]
          for box in boxes:
              dst.paste(old_lab.crop(box), box[:2])
          for y in range(dst.height):
              for x in range(dst.width):
                  inside = any(x0 <= x < x1 and y0 <= y < y1 for x0, y0, x1, y1 in boxes)
                  if inside:
                      assert dst.getpixel((x, y)) == old_lab.getpixel((x, y)), (x, y, 'target mismatch')
                  else:
                      assert dst.getpixel((x, y)) == before.getpixel((x, y)), (x, y, 'outside-cell changed')
          dst.save(dst_path)
          print('Verified: v4 items.png changed only in the two Lab icon cells.')
          PY
          if ! git diff --quiet -- core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Assets.java core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/sprites/ItemSpriteSheet.java core/src/main/assets/sprites/items.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Assets.java \
                    core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/sprites/ItemSpriteSheet.java \
                    core/src/main/assets/sprites/items.png
            git commit -m "feat: register SPD Lab assets on v4.0 sprite layout"
            git push origin HEAD:spdlab-4.0-port
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPD-Lab-4.0-port1
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
