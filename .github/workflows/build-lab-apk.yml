name: Build Lab APK

on:
  push:
    branches:
      - spdlab-4.0-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply Task 5 Lab mode hooks once
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f"{label}: expected exactly one anchor, found {count}"
              return text.replace(old, new, 1)

          # Dungeon: persist Lab mode and create LabLevel only for the normal branch.
          p = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Dungeon.java')
          text = p.read_text()
          if 'import com.shatteredpixel.shatteredpixeldungeon.levels.LabLevel;' not in text:
              text = replace_once(text,
                  'import com.shatteredpixel.shatteredpixeldungeon.levels.HallsLevel;\nimport com.shatteredpixel.shatteredpixeldungeon.levels.LastLevel;\n',
                  'import com.shatteredpixel.shatteredpixeldungeon.levels.HallsLevel;\nimport com.shatteredpixel.shatteredpixeldungeon.levels.LabLevel;\nimport com.shatteredpixel.shatteredpixeldungeon.levels.LastLevel;\n',
                  'Dungeon LabLevel import')
          if 'public static boolean labMode;' not in text:
              text = replace_once(text,
                  '\tpublic static boolean daily;\n\tpublic static boolean dailyReplay;\n',
                  '\tpublic static boolean daily;\n\tpublic static boolean dailyReplay;\n\tpublic static boolean labMode;\n',
                  'Dungeon labMode field')
          if 'if (labMode && branch == 0)' not in text:
              text = replace_once(text,
                  '\t\tLevel level;\n\t\tif (branch == 0) {\n',
                  '\t\tLevel level;\n\t\tif (labMode && branch == 0) {\n\t\t\tlevel = new LabLevel();\n\t\t} else if (branch == 0) {\n',
                  'Dungeon LabLevel branch')
          if 'private static final String LAB_MODE' not in text:
              text = replace_once(text,
                  '\tprivate static final String DAILY_REPLAY= "daily_replay";\n\tprivate static final String LAST_PLAYED = "last_played";\n',
                  '\tprivate static final String DAILY_REPLAY= "daily_replay";\n\tprivate static final String LAB_MODE    = "lab_mode";\n\tprivate static final String LAST_PLAYED = "last_played";\n',
                  'Dungeon Lab mode key')
          if 'bundle.put( LAB_MODE, labMode );' not in text:
              text = replace_once(text,
                  '\t\t\tbundle.put( DAILY_REPLAY, dailyReplay );\n\t\t\tbundle.put( LAST_PLAYED, lastPlayed = Game.realTime);\n',
                  '\t\t\tbundle.put( DAILY_REPLAY, dailyReplay );\n\t\t\tbundle.put( LAB_MODE, labMode );\n\t\t\tbundle.put( LAST_PLAYED, lastPlayed = Game.realTime);\n',
                  'Dungeon save Lab mode')
          if 'labMode = bundle.contains(LAB_MODE)' not in text:
              text = replace_once(text,
                  '\t\tdaily = bundle.getBoolean( DAILY );\n\t\tdailyReplay = bundle.getBoolean( DAILY_REPLAY );\n\n\t\tActor.clear();\n',
                  '\t\tdaily = bundle.getBoolean( DAILY );\n\t\tdailyReplay = bundle.getBoolean( DAILY_REPLAY );\n\t\tlabMode = bundle.contains(LAB_MODE) && bundle.getBoolean(LAB_MODE);\n\n\t\tActor.clear();\n',
                  'Dungeon load Lab mode')
          p.write_text(text)

          # Level: preserve Yandere state across transitions and spawn two hearts on normal floors.
          p = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/Level.java')
          text = p.read_text()
          if 'import com.shatteredpixel.shatteredpixeldungeon.items.RedRibbon;' not in text:
              text = replace_once(text,
                  'import com.shatteredpixel.shatteredpixeldungeon.items.Heap;\nimport com.shatteredpixel.shatteredpixeldungeon.items.Item;\nimport com.shatteredpixel.shatteredpixeldungeon.items.Stylus;\n',
                  'import com.shatteredpixel.shatteredpixeldungeon.items.Heap;\nimport com.shatteredpixel.shatteredpixeldungeon.items.Item;\nimport com.shatteredpixel.shatteredpixeldungeon.items.RedRibbon;\nimport com.shatteredpixel.shatteredpixeldungeon.items.YandereHeart;\nimport com.shatteredpixel.shatteredpixeldungeon.items.Stylus;\n',
                  'Level Yandere imports')
          if '// LAB3-y02 HEART SPAWN' not in text:
              text = replace_once(text,
                  '\t\tif (!Dungeon.bossLevel() && Dungeon.branch == 0) {\n\n\t\t\taddItemToSpawn(Generator.random(Generator.Category.FOOD));\n',
                  '\t\tif (!Dungeon.bossLevel() && Dungeon.branch == 0) {\n\t\t\t// LAB3-y02 HEART SPAWN\n\t\t\taddItemToSpawn(new YandereHeart());\n\t\t\taddItemToSpawn(new YandereHeart());\n\n\t\t\taddItemToSpawn(Generator.random(Generator.Category.FOOD));\n',
                  'Level heart spawn')
          if '\t\tRedRibbon.beforeTransition();' not in text:
              text = replace_once(text,
                  '\tpublic static void beforeTransition(){\n\n\t\t//time freeze effects need to resolve their pressed cells before transitioning\n',
                  '\tpublic static void beforeTransition(){\n\t\tRedRibbon.beforeTransition();\n\n\t\t//time freeze effects need to resolve their pressed cells before transitioning\n',
                  'Level ribbon transition')
          p.write_text(text)

          # HeroSelectScene: explicit Normal/Lab chooser, while daily runs always disable Lab mode.
          p = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/HeroSelectScene.java')
          text = p.read_text()
          if 'showModeSelection();' not in text:
              text = replace_once(text,
                  '\t\t\t\tif (GamesInProgress.selectedClass == null) return;\n\n'
                  '\t\t\t\tDungeon.hero = null;\n'
                  '\t\t\t\tDungeon.daily = Dungeon.dailyReplay = false;\n'
                  '\t\t\t\tDungeon.initSeed();\n'
                  '\t\t\t\tActionIndicator.clearAction();\n'
                  '\t\t\t\tInterlevelScene.mode = InterlevelScene.Mode.DESCEND;\n\n'
                  '\t\t\t\tGame.switchScene( InterlevelScene.class );\n',
                  '\t\t\t\tif (GamesInProgress.selectedClass == null) return;\n'
                  '\t\t\t\tshowModeSelection();\n',
                  'HeroSelect start button')
          if 'private void showModeSelection()' not in text:
              methods = '''\tprivate void showModeSelection() {\n\t\tShatteredPixelDungeon.scene().addToFront(new WndOptions(\n\t\t\t\t"게임 모드",\n\t\t\t\t"일반 모드는 기존 녹픽던을 그대로 시작한다.\\n\\n"\n\t\t\t\t\t\t+ "실험실 모드는 아이템 구역, 넓은 추격 구역, 몬스터 소환 구역으로 "\n\t\t\t\t\t\t+ "나뉜 고정 테스트 맵을 처음부터 생성한다.",\n\t\t\t\t"일반 모드",\n\t\t\t\t"실험실 모드",\n\t\t\t\t"취소") {\n\t\t\t@Override\n\t\t\tprotected void onSelect(int index) {\n\t\t\t\tif (index == 0) startNewGame(false);\n\t\t\t\tif (index == 1) startNewGame(true);\n\t\t\t}\n\t\t});\n\t}\n\n\tprivate void startNewGame(boolean laboratory) {\n\t\tDungeon.hero = null;\n\t\tDungeon.daily = Dungeon.dailyReplay = false;\n\t\tDungeon.labMode = laboratory;\n\t\tDungeon.initSeed();\n\t\tActionIndicator.clearAction();\n\t\tInterlevelScene.mode = InterlevelScene.Mode.DESCEND;\n\n\t\tGame.switchScene(InterlevelScene.class);\n\t}\n\n'''
              text = replace_once(text,
                  '\tprivate void updateOptionsColor(){\n',
                  methods + '\tprivate void updateOptionsColor(){\n',
                  'HeroSelect mode methods')
          if '\t\t\t\t\t\t\t\tDungeon.labMode = false;' not in text:
              text = replace_once(text,
                  '\t\t\t\t\t\t\t\tDungeon.hero = null;\n\t\t\t\t\t\t\t\tDungeon.daily = true;\n\t\t\t\t\t\t\t\tDungeon.initSeed();\n',
                  '\t\t\t\t\t\t\t\tDungeon.hero = null;\n\t\t\t\t\t\t\t\tDungeon.daily = true;\n\t\t\t\t\t\t\t\tDungeon.labMode = false;\n\t\t\t\t\t\t\t\tDungeon.initSeed();\n',
                  'HeroSelect daily Lab reset')
          p.write_text(text)
          PY

          if ! git diff --quiet -- \
            core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Dungeon.java \
            core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/Level.java \
            core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/HeroSelectScene.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Dungeon.java \
              core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/levels/Level.java \
              core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/HeroSelectScene.java
            git commit -m "feat: port SPD Lab mode and LabLevel to v4.0"
            git push origin HEAD:spdlab-4.0-port
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPD-Lab-4.0-port1
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
