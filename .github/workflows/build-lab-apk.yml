name: Build Lab APK

on:
  push:
    branches:
      - master
      - feature/yandere-lab-v04
      - lab3-growth-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply one-time help dialogue fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java')
          text = path.read_text(encoding='utf-8')

          if 'private boolean suppressGuardModeDialogue = false;' not in text:
              old_field = '    private int lastHeroPosForTrapScan = -1;\n'
              if old_field not in text:
                  raise SystemExit('field anchor not found')
              text = text.replace(old_field, old_field + '    private boolean suppressGuardModeDialogue = false;\n', 1)

          old_help = '''    public boolean requestHelp() {
        if (!hasEmergencyRecall() || hostileToHero() || Dungeon.hero == null || Dungeon.level == null) return false;
        if (Dungeon.level.distance(pos, Dungeon.hero.pos) > 1) {
            int cell = safeAdjacentCell(Dungeon.hero.pos);
            if (cell == -1) return false;
            ScrollOfTeleportation.appear(this, cell);
        }
        boolean wasPeace = mode() == MODE_PEACE;
        if (wasPeace) setMode(MODE_GUARD);
        else followHero();
        Char threat = nearestEnemyInGrowthGuardRange();
        if (threat != null) targetChar(threat);
        if (!wasPeace) yell("불렀어? 바로 왔어♡ 네 옆에 있을게. 이제 내가 막아줄게.");
        return true;
    }
'''
          new_help = '''    public boolean requestHelp() {
        if (!hasEmergencyRecall() || hostileToHero() || Dungeon.hero == null || Dungeon.level == null) return false;
        if (Dungeon.level.distance(pos, Dungeon.hero.pos) > 1) {
            int cell = safeAdjacentCell(Dungeon.hero.pos);
            if (cell == -1) return false;
            ScrollOfTeleportation.appear(this, cell);
        }
        boolean wasPeace = mode() == MODE_PEACE;
        if (wasPeace) {
            suppressGuardModeDialogue = true;
            setMode(MODE_GUARD);
            suppressGuardModeDialogue = false;
        } else {
            followHero();
        }
        Char threat = nearestEnemyInGrowthGuardRange();
        if (threat != null) targetChar(threat);
        yell("불렀어? 바로 왔어♡ 네 옆에 있을게. 이제 내가 막아줄게.");
        return true;
    }
'''
          if old_help in text:
              text = text.replace(old_help, new_help, 1)
          elif new_help not in text:
              raise SystemExit('requestHelp anchor not found')

          old_yell = '''    @Override
    public void yell(String text) {
        int kind = dialogueKind(text);
'''
          new_yell = '''    @Override
    public void yell(String text) {
        if (suppressGuardModeDialogue) {
            suppressGuardModeDialogue = false;
            if ("응♡ 네 옆에 딱 붙어 있을게. 가까이 오는 것만 내가 치워줄게.".equals(text)) return;
        }
        int kind = dialogueKind(text);
'''
          if old_yell in text:
              text = text.replace(old_yell, new_yell, 1)
          elif new_yell not in text:
              raise SystemExit('yell anchor not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPD-Lab-v03-yandere024
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error

      - name: Commit fix and restore workflows
        run: |
          if git diff --quiet -- core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java; then
            echo "Dialogue fix already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/build-lab-apk.yml
          git rm -f .github/workflows/stage13_help_dialogue_fix.yml || true
          git add core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java .github/workflows/build-lab-apk.yml
          git commit -m "fix: use help request dialogue from peace mode"
          git push origin HEAD:lab3-growth-dev
