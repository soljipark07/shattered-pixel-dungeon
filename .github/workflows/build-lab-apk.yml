name: Build Lab APK

on:
  push:
    branches:
      - master
      - feature/yandere-lab-v04
      - lab3-growth-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply Stage 9 hero interaction hook
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hero = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java')
          text = hero.read_text()

          import_anchor = 'import com.shatteredpixel.shatteredpixeldungeon.actors.mobs.npcs.YandereAlly;'
          import_line = 'import com.shatteredpixel.shatteredpixeldungeon.actors.mobs.npcs.YandereJealousy;'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('YandereAlly import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          hook = '''\t\t\tif (YandereJealousy.onHeroInteract(ch)) {
          \t\t\t\treturn true;
          \t\t\t}
          \t\t\treturn ch.interact(this);'''
          if hook not in text:
              old = '''\t\t\tready();
          \t\t\tsprite.turnTo( pos, ch.pos );
          \t\t\treturn ch.interact(this);'''
              new = '''\t\t\tready();
          \t\t\tsprite.turnTo( pos, ch.pos );
          \t\t\tif (YandereJealousy.onHeroInteract(ch)) {
          \t\t\t\treturn true;
          \t\t\t}
          \t\t\treturn ch.interact(this);'''
              if old not in text:
                  raise SystemExit('Hero interaction anchor not found')
              text = text.replace(old, new, 1)

          hero.write_text(text)
          PY

          if ! git diff --quiet -- core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java
            git commit -m "stage9: hook jealousy into hero interactions"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPD-Lab-v03-yandere024
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
