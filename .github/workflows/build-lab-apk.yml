name: Build Lab APK

on:
  push:
    branches:
      - lab3-growth-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: lab3-growth-dev

      - name: Apply dialogue and curse corrections
        env:
          PATCH_B64: "???"
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/items/RedRibbon.java core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/hero/Hero.java core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/YandereJealousy.java
            git commit -m "fix: align obsession dialogue with original design"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPD-Lab-v03-yandere024
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
