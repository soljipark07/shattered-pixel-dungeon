name: Stage13 Help Dialogue Fix

on:
  push:
    branches:
      - lab3-growth-dev
    paths:
      - .github/workflows/stage13_help_dialogue_fix.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: lab3-growth-dev

      - name: Patch help-request dialogue
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java')
          text = path.read_text(encoding='utf-8')

          old_field = '    private int lastHeroPosForTrapScan = -1;\n'
          new_field = old_field + '    private boolean suppressGuardModeDialogue = false;\n'
          if old_field not in text:
              raise SystemExit('field anchor not found')
          text = text.replace(old_field, new_field, 1)

          old_help = '''    public boolean requestHelp() {
        if (!hasEmergencyRecall() || hostileToHero() || Dungeon.hero == null || Dungeon.level == null) return false;
        if (Dungeon.level.distance(pos, Dungeon.hero.pos) > 1) {
            int cell = safeAdjacentCell(Dungeon.hero.pos);
            if (cell == -1) return false;
            ScrollOfTeleportation.appear(this, cell);
        }
        boolean wasPeace = mode() == MODE_PEACE;
        if (wasPeace) setMode(MODE_GUARD);
        else followHero();
        Char threat = nearestEnemyInGrowthGuardRange();
        if (threat != null) targetChar(threat);
        if (!wasPeace) yell("불렀어? 바로 왔어♡ 네 옆에 있을게. 이제 내가 막아줄게.");
        return true;
    }
'''
          new_help = '''    public boolean requestHelp() {
        if (!hasEmergencyRecall() || hostileToHero() || Dungeon.hero == null || Dungeon.level == null) return false;
        if (Dungeon.level.distance(pos, Dungeon.hero.pos) > 1) {
            int cell = safeAdjacentCell(Dungeon.hero.pos);
            if (cell == -1) return false;
            ScrollOfTeleportation.appear(this, cell);
        }
        boolean wasPeace = mode() == MODE_PEACE;
        if (wasPeace) {
            suppressGuardModeDialogue = true;
            setMode(MODE_GUARD);
            suppressGuardModeDialogue = false;
        } else {
            followHero();
        }
        Char threat = nearestEnemyInGrowthGuardRange();
        if (threat != null) targetChar(threat);
        yell("불렀어? 바로 왔어♡ 네 옆에 있을게. 이제 내가 막아줄게.");
        return true;
    }
'''
          if old_help not in text:
              raise SystemExit('requestHelp anchor not found')
          text = text.replace(old_help, new_help, 1)

          old_yell = '''    @Override
    public void yell(String text) {
        int kind = dialogueKind(text);
'''
          new_yell = '''    @Override
    public void yell(String text) {
        if (suppressGuardModeDialogue) {
            suppressGuardModeDialogue = false;
            if ("응♡ 네 옆에 딱 붙어 있을게. 가까이 오는 것만 내가 치워줄게.".equals(text)) return;
        }
        int kind = dialogueKind(text);
'''
          if old_yell not in text:
              raise SystemExit('yell anchor not found')
          text = text.replace(old_yell, new_yell, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug

      - name: Commit dialogue fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/npcs/GrowthYandereAlly.java
          git commit -m "fix: use help request dialogue from peace mode"
          git push origin HEAD:lab3-growth-dev
